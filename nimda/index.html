<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Birdbrain · Admin</title>
<link rel="icon" href="../favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gabarito:wght@700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Quicksand:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f5f1; --surface:#fff; --soft:#efeee9; --ink:#14161a; --muted:#6a707b; --line:#e4e3dd;
  --brand:#ff6b1a; --brand-d:#e95a0b; --good:#10a35e; --bad:#e5483b; --blue:#4aa8ec;
  --shadow:0 1px 2px rgba(20,22,26,.05),0 14px 34px -16px rgba(20,22,26,.22);
  --display:"Gabarito","Plus Jakarta Sans",system-ui,sans-serif; --body:"Plus Jakarta Sans",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--body)}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-family:var(--display);letter-spacing:-.02em;line-height:1.1}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
.hidden{display:none!important}
.wrap{max-width:1160px;margin:0 auto;padding:0 20px 60px}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:8px}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.lcard{background:var(--surface);border-radius:28px;padding:34px 30px;width:min(380px,100%);box-shadow:var(--shadow);text-align:center}
.lcard img{width:64px;height:64px}
.lcard h1{font-size:28px;margin:12px 0 4px}
.lcard p{color:var(--muted);margin-bottom:20px}
.lcard input{width:100%;border:0;border-radius:14px;background:var(--soft);padding:15px 16px;font-size:18px;text-align:center;letter-spacing:.2em;margin-bottom:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;border-radius:14px;padding:13px 22px;font-weight:700;background:var(--brand);color:#fff;transition:.12s;width:100%}
.btn:hover{background:var(--brand-d)}
.btn[disabled]{opacity:.5;cursor:wait}
.btn.sm{width:auto;padding:9px 16px;font-size:14px;border-radius:12px}
.btn.ghost{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.ghost:hover{background:var(--soft)}
.err{color:var(--bad);font-weight:600;min-height:22px;margin-top:10px;font-size:14px}

/* layout */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 0;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:"Quicksand",var(--display);font-weight:700;font-size:26px}
.brand img.wm{width:auto;height:46px}
.lcard img.wm{width:auto;height:74px}
.brand small{font:600 12px var(--body);letter-spacing:.06em;text-transform:uppercase;background:var(--ink);color:#fff;border-radius:99px;padding:3px 10px;margin-left:4px}
.tools{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}
.sec-t{font-family:var(--display);font-weight:800;font-size:24px;margin:30px 0 4px}
.sec-s{color:var(--muted);margin-bottom:14px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:16px}
.card{background:var(--surface);border-radius:24px;padding:20px 22px;box-shadow:var(--shadow);min-width:0}
.card h3{font-size:19px;margin-bottom:2px}
.card .sub{color:var(--muted);font-size:13px;margin-bottom:14px}
.empty{color:var(--muted);padding:12px 0}

/* all-time hero */
.hero{display:grid;grid-template-columns:1.25fr 1fr 1fr 1fr;gap:12px}
.kpi{background:var(--surface);border-radius:24px;padding:20px 22px;box-shadow:var(--shadow)}
.kpi .l{font-size:12.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.kpi .v{font-family:var(--display);font-weight:800;font-size:40px;letter-spacing:-.03em;line-height:1.1;margin:4px 0 2px}
.kpi .s{font-size:13px;color:var(--muted)}
.kpi.big{background:var(--brand);color:#fff}
.kpi.big .l,.kpi.big .s{color:rgba(255,255,255,.88)}
.kpi.big .v{font-size:62px}
.periods{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}
.periods .kpi .v{font-size:30px}
.up{color:var(--good);font-weight:700}.dn{color:var(--bad);font-weight:700}
.insights{background:var(--ink);color:#fff;border-radius:26px;padding:22px 24px;margin:16px 0 0}
.insights h2{font-size:22px;margin-bottom:10px}
.insights ul{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:8px 28px}
.insights li{padding-left:20px;position:relative;opacity:.95}
.insights li::before{content:"";position:absolute;left:0;top:.55em;width:9px;height:9px;border-radius:50%;background:var(--brand)}
.insights b{color:#ffb98a}

/* charts and lists */
.bl{display:grid;gap:9px}
.br{display:grid;grid-template-columns:minmax(90px,40%) 1fr auto;gap:10px;align-items:center;font-size:14px}
.br .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.br .t{height:12px;background:var(--soft);border-radius:99px;overflow:hidden}
.br .t i{display:block;height:100%;background:var(--brand);border-radius:99px}
.br.b .t i{background:var(--blue)}
.br .c{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;white-space:nowrap}
.br .c b{color:var(--ink)}
.cols{display:flex;align-items:flex-end;gap:3px;height:140px;padding-top:6px}
.col{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.col i{display:block;background:#ffcfb0;border-radius:5px 5px 0 0;min-height:2px;position:relative}
.col i u{position:absolute;left:0;right:0;bottom:0;background:var(--brand);border-radius:5px 5px 0 0;text-decoration:none}
.col.one i{background:var(--brand)}
.col.blue i{background:var(--blue)}
.axis{display:flex;gap:3px;margin-top:6px;font-size:11px;color:var(--muted)}
.axis span{flex:1;text-align:center;min-width:0;white-space:nowrap}
.split{display:flex;height:18px;border-radius:99px;overflow:hidden;margin:6px 0 10px;background:var(--soft)}
.split i{display:block;height:100%}
.sl{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.sl b{color:var(--ink)}
.sl s{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;text-decoration:none}
.big-n{font-family:var(--display);font-weight:800;font-size:44px;letter-spacing:-.03em;line-height:1.05}
.rows .row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.rows .row:first-child{border-top:0}
.rows .row span:first-child{color:var(--muted)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}
th{text-align:left;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:6px 10px 8px}
td{padding:9px 10px;border-top:1px solid var(--line);white-space:nowrap}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td .mini{display:inline-block;vertical-align:middle;height:8px;border-radius:99px;background:var(--brand);margin-right:8px}
.birds{display:grid;gap:10px}
.bird{display:flex;align-items:center;gap:12px}
.bird .th{flex:none;width:52px;height:52px;border-radius:14px;background:var(--soft);position:relative;overflow:hidden}
.bird .th img{position:absolute;left:4%;top:4%;width:92%;height:92%;object-fit:contain}
.bird .bn{flex:1;min-width:0;font-weight:700;line-height:1.2}
.bird .bn small{display:block;font-weight:500;color:var(--muted);font-size:12.5px}
.bird .pc{font-family:var(--display);font-weight:800;font-size:22px}
.bird .pc.lo{color:var(--bad)}.bird .pc.hi{color:var(--good)}
.pill{display:inline-block;border-radius:99px;padding:2px 9px;font-size:12px;font-weight:700;background:var(--soft)}
.pill.ok{background:#dff4e8;color:#0b7a46}.pill.no{background:#fde5e1;color:#b13324}.pill.mid{background:#fdf0d2;color:#8a5a00}
td .ago{color:var(--muted);font-size:12.5px;margin-left:6px}
td .lbl{display:inline-block;max-width:300px;overflow:hidden;text-overflow:ellipsis;vertical-align:bottom}
.note{color:var(--muted);font-size:12.5px;margin-top:26px;text-align:center}
@media (max-width:860px){.hero{grid-template-columns:1fr 1fr}.kpi.big{grid-column:1/-1}}
@media (max-width:560px){.grid{grid-template-columns:1fr}.periods{grid-template-columns:1fr}.insights ul{grid-template-columns:1fr}.kpi.big .v{font-size:52px}}
</style>
</head>
<body>

<div class="login" id="login">
  <form class="lcard" id="form" autocomplete="off">
    <img class="wm" src="../assets/wordmark.png" alt="Birdbrain">
    <h1>Admin</h1>
    <p>Enter the password to see how Birdbrain is being played.</p>
    <input id="pw" type="password" inputmode="numeric" placeholder="Password" aria-label="Password" autofocus>
    <button class="btn" id="go" type="submit">Open dashboard</button>
    <div class="err" id="err" role="alert"></div>
  </form>
</div>

<div class="wrap hidden" id="dash">
  <header class="top">
    <div class="brand"><img class="wm" src="../assets/wordmark.png" alt="Birdbrain"> <small>Admin</small></div>
    <div class="tools"><span id="updated"></span><button class="btn ghost sm" id="refresh">Refresh</button><button class="btn ghost sm" id="logout">Log out</button></div>
  </header>
  <div id="body"></div>
  <p class="note">Anonymous play data: a random player id, what was played and the country. No names, no IP addresses. Times are in IST.</p>
</div>

<script>
(() => {
"use strict";
const API = location.hostname === 'localhost' ? 'http://localhost:8787' : 'https://birdbrain-stats.birdbrain-stats.workers.dev';
const RAW = 'https://raw.githubusercontent.com/alchaincyf/huashu-bird-sticker/main/';
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nf = n => Math.round(n || 0).toLocaleString('en-IN');
const pc = x => (x == null || isNaN(x) ? '–' : Math.round(x * 100) + '%');
const LV = { easy: 'Easy', medium: 'Medium', hard: 'Hard' };
const SRCNAME = { direct: 'Direct (typed or bookmarked link)', 'whatsapp-share': 'WhatsApp challenge link', 'score-card': 'Score card share', 'copied-link': 'Copied link', 'site-share': 'Footer share button', 'facebook-share': 'Facebook share', 'x-share': 'X share', 'linkedin-share': 'LinkedIn share', 'telegram-share': 'Telegram share', 'email-share': 'Email share', 'phone-share': "Phone's share sheet" };
const SHARELINK = new Set(['whatsapp-share', 'score-card', 'copied-link', 'site-share', 'facebook-share', 'x-share', 'linkedin-share', 'telegram-share', 'email-share', 'phone-share']);
const srcName = s => SRCNAME[s] || s;
const CN = (() => { try { const r = new Intl.DisplayNames(['en'], { type: 'region' }); return c => (c && c.length === 2 && c !== '??' ? r.of(c) : 'Unknown'); } catch (e) { return c => c || 'Unknown'; } })();
let pw = '';

/* ---------- login ---------- */
async function load(password) {
  const r = await fetch(API + '/admin/stats', { method: 'POST', body: JSON.stringify({ password }), headers: { 'Content-Type': 'text/plain' } });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'Could not load stats');
  return j;
}
async function enter(password) {
  $('#go').disabled = true; $('#err').textContent = '';
  try {
    const d = await load(password); pw = password;
    try { sessionStorage.setItem('bb.admin', password); } catch (e) {}
    $('#login').classList.add('hidden'); $('#dash').classList.remove('hidden');
    render(d);
  } catch (e) {
    $('#err').textContent = /fetch/i.test(e.message) ? 'Could not reach the stats server.' : e.message;
    try { sessionStorage.removeItem('bb.admin'); } catch (x) {}
    $('#login').classList.remove('hidden'); $('#dash').classList.add('hidden');
  } finally { $('#go').disabled = false; }
}
$('#form').addEventListener('submit', e => { e.preventDefault(); const v = $('#pw').value.trim(); if (v) enter(v); });
$('#logout').onclick = () => { pw = ''; try { sessionStorage.removeItem('bb.admin'); } catch (e) {} $('#pw').value = ''; $('#dash').classList.add('hidden'); $('#login').classList.remove('hidden'); };
$('#refresh').onclick = async () => { $('#refresh').disabled = true; try { render(await load(pw)); } catch (e) { alert(e.message); } $('#refresh').disabled = false; };
try { const saved = sessionStorage.getItem('bb.admin'); if (saved) enter(saved); } catch (e) {}

/* ---------- bird names + pictures (loaded only after login) ---------- */
let birdMap = null;
function loadBirds() {
  if (birdMap) return Promise.resolve(birdMap);
  return new Promise(res => {
    const s = document.createElement('script'); s.src = '../data/birds-data.js';
    s.onload = () => { const D = window.BIRD_DATA, m = {}; for (const b of D.birds) { const f = D.fams[b.f]; m[b.i] = { name: b.n[0], url: RAW + `stickers/${f.o}/${f.l}/${b.i}.webp` }; } birdMap = m; res(m); };
    s.onerror = () => res({});
    document.head.appendChild(s);
  });
}

/* ---------- helpers ---------- */
const barList = (rows, { cls = '', fmt = r => `<b>${nf(r.n)}</b>` } = {}) => {
  if (!rows.length) return '<div class="empty">No data yet.</div>';
  const m = Math.max(...rows.map(r => r.n), 1);
  return `<div class="bl">${rows.map(r => `<div class="br ${cls}"><span class="n" title="${esc(r.label)}">${esc(r.label)}</span><span class="t"><i style="width:${Math.max(r.n / m * 100, 2)}%"></i></span><span class="c">${fmt(r)}</span></div>`).join('')}</div>`;
};
const istDate = off => new Date(Date.now() + 19800e3 - off * 864e5).toISOString().slice(0, 10);
const hourLabel = h => (h % 12 || 12) + (h < 12 ? 'a' : 'p');
const dayLabel = k => k.slice(8) + '/' + k.slice(5, 7);
const timeIST = ts => new Date(ts).toLocaleString('en-IN', { timeZone: 'Asia/Kolkata', day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' });
const ago = ts => { const m = Math.max(0, Math.round((Date.now() - ts) / 60000)); return m < 1 ? 'just now' : m < 60 ? m + ' min ago' : m < 1440 ? Math.floor(m / 60) + ' h ago' : Math.floor(m / 1440) + ' d ago'; };

/* ---------- render ---------- */
async function render(d) {
  const a = d.allTime || {}, e = d.earlier || {}, t = d.totals || {}, p = d.periods || {};
  $('#updated').textContent = 'Updated ' + new Date(d.generated).toLocaleTimeString('en-IN', { timeZone: 'Asia/Kolkata', hour: 'numeric', minute: '2-digit' }) + ' IST';
  const earlierG = e.earlier_games || 0, earlierP = e.earlier_players || 0;
  const totalGames = (a.started || 0) + earlierG, tracked = t.games || 0, players = (t.players || 0) + earlierP;
  if (!tracked && !earlierG) { $('#body').innerHTML = '<div class="card" style="text-align:center;padding:50px 20px"><h3>No games yet</h3><p class="sub">Play a game on the live site and refresh this page.</p></div>'; return; }

  const fin = t.finished || 0, shares = (d.shares || []).reduce((x, r) => x + r.n, 0), sk = k => ((d.shares || []).find(r => r.kind === k) || {}).n || 0;
  const d7 = p.d7 || 0, prev7 = p.prev7 || 0, trend = prev7 ? (d7 - prev7) / prev7 : null;
  const comeBack = t.players ? d.multiDay / t.players : 0;
  const decks = d.decks || [], decks7 = Object.fromEntries((d.decks7 || []).map(r => [r.deck, r.n])), n7 = (d.decks7 || []).reduce((x, r) => x + r.n, 0);

  // ---- what stands out ----
  const ins = [];
  ins.push(`<b>${nf(totalGames)}</b> games played in all, by about <b>${nf(players)}</b> players${earlierG ? ` (includes about ${nf(earlierG)} games before tracking began)` : ''}.`);
  ins.push(`<b>${nf(d7)}</b> games in the last 7 days${trend == null ? '' : `, <b>${trend >= 0 ? 'up' : 'down'} ${Math.abs(Math.round(trend * 100))}%</b> on the week before`}.`);
  if (decks[0]) { const top = decks[0], all = top.n / tracked, wk = n7 ? (decks7[top.deck] || 0) / n7 : null; ins.push(`<b>${esc(top.title)}</b> is ${pc(all)} of all games${wk == null ? '' : ` and <b>${pc(wk)}</b> of the last 7 days`}.`); }
  if (t.players > 1) ins.push(`<b>${pc(comeBack)}</b> of players came back on a different day.`);
  if (tracked) ins.push(`<b>${pc(fin / tracked)}</b> of games are played to the end${t.no_answer / tracked >= 0.01 ? `, and <b>${pc(t.no_answer / tracked)}</b> are left before the first answer` : ''}.`);
  if (d.hardest && d.hardest[0]) ins.push(`The hardest bird is <b>_HARD_</b>: only <b>${pc(d.hardest[0].ok / d.hardest[0].seen)}</b> of players get it right.`);
  const viaShare = (d.sources || []).filter(s => SHARELINK.has(s.s)).reduce((x, s) => x + s.n, 0);
  if (tracked) ins.push(`<b>${pc(viaShare / tracked)}</b> of games started from a link someone shared. ${shares && fin ? `Players share about <b>1 result per ${Math.max(1, Math.round(fin / shares))}</b> finished games.` : ''}`);
  const ct = (d.countries || [])[0]; if (ct) ins.push(`Most players are from <b>${esc(CN(ct.country))}</b> (${pc(ct.n / tracked)}).`);

  // ---- charts ----
  const dayMap = Object.fromEntries((d.daily || []).map(r => [r.d, r])), npMap = Object.fromEntries((d.newPlayers || []).map(r => [r.d, r.n]));
  const days = Array.from({ length: 30 }, (_, i) => istDate(29 - i));
  const dmax = Math.max(...days.map(k => (dayMap[k] || {}).n || 0), 1), nmax = Math.max(...days.map(k => npMap[k] || 0), 1);
  const gcols = days.map(k => { const r = dayMap[k] || { n: 0, f: 0 }; return `<div class="col" title="${k}: ${r.n} games, ${r.f || 0} finished"><i style="height:${r.n / dmax * 100}%"><u style="height:${r.n ? (r.f || 0) / r.n * 100 : 0}%"></u></i></div>`; }).join('');
  const ncols = days.map(k => `<div class="col blue" title="${k}: ${npMap[k] || 0} new players"><i style="height:${(npMap[k] || 0) / nmax * 100}%"></i></div>`).join('');
  const axis = days.map((k, i) => `<span>${i % 5 === 0 ? dayLabel(k) : ''}</span>`).join('');
  const hMap = Object.fromEntries((d.hourly || []).map(r => [r.h, r.n])), hmax = Math.max(...Object.values(hMap), 1);
  const hcols = Array.from({ length: 24 }, (_, h) => `<div class="col one" title="${hourLabel(h)}: ${hMap[h] || 0} games"><i style="height:${(hMap[h] || 0) / hmax * 100}%"></i></div>`).join('');
  const haxis = Array.from({ length: 24 }, (_, h) => `<span>${h % 3 === 0 ? hourLabel(h) : ''}</span>`).join('');

  // ---- how games end ----
  const endParts = [['Finished', fin, 'var(--good)'], ['Left early', t.left_early || 0, '#f2b134'], ['Left before answering', t.no_answer || 0, 'var(--bad)']];
  const endHtml = `<div class="split">${endParts.map(([, n, c]) => `<i style="width:${n / Math.max(tracked, 1) * 100}%;background:${c}"></i>`).join('')}</div>
    <div class="sl">${endParts.map(([l, n, c]) => `<span><s style="background:${c}"></s><b>${pc(n / Math.max(tracked, 1))}</b> ${l}</span>`).join('')}</div>
    ${t.left_early_at ? `<p class="sub" style="margin:12px 0 0">People who leave early usually do so after about <b style="color:var(--ink)">${Math.round(t.left_early_at)}</b> answers.</p>` : ''}`;

  // ---- games per player ----
  const order = ['1', '2', '3-5', '6-10', '11+'], pp = Object.fromEntries((d.perPlayer || []).map(r => [r.b, r.n]));
  const ppRows = order.filter(k => pp[k]).map(k => ({ label: k === '1' ? '1 game' : k + ' games', n: pp[k] }));

  // ---- decks table ----
  const dmaxN = Math.max(...decks.map(r => r.n), 1);
  const deckRows = decks.map(r => { const wk = n7 ? (decks7[r.deck] || 0) / n7 : null;
    return `<tr><td>${esc(r.title)}</td><td class="num"><span class="mini" style="width:${Math.max(r.n / dmaxN * 60, 3)}px"></span>${nf(r.n)}</td><td class="num">${pc(r.n / tracked)}</td><td class="num">${wk == null ? '–' : pc(wk)}</td><td class="num">${pc(r.f / r.n)}</td><td class="num">${pc(r.acc)}</td></tr>`; }).join('');
  const levels = ['easy', 'medium', 'hard'].map(k => (d.levels || []).find(l => l.level === k)).filter(Boolean);
  const feat = [['Hard mode', ((d.levels || []).find(l => l.level === 'hard') || {}).n || 0], ['Custom decks', t.custom || 0], ['Timer on', t.timed || 0], ['Shadow mode', t.shadow || 0], ['Endless', t.endless || 0]];

  // ---- audience ----
  const dev = d.devices || [], devTot = dev.reduce((x, r) => x + r.n, 0) || 1, devC = { mobile: 'var(--brand)', desktop: 'var(--blue)' };
  const devHtml = `<div class="split">${dev.map(r => `<i style="width:${r.n / devTot * 100}%;background:${devC[r.device] || '#999'}"></i>`).join('')}</div><div class="sl">${dev.map(r => `<span><s style="background:${devC[r.device] || '#999'}"></s><b>${pc(r.n / devTot)}</b> ${esc(r.device)}</span>`).join('')}</div>`;
  const sharesNames = { whatsapp: 'WhatsApp challenge', card: 'Score card', copy: 'Copied score' };

  // ---- latest games ----
  const recentRows = (d.recent || []).map(r => {
    const result = r.finished ? '<span class="pill ok">finished</span>' : r.answered ? '<span class="pill mid">left early</span>' : '<span class="pill no">left before answering</span>';
    const deckCell = r.custom ? `<span class="lbl" title="${esc(r.custom_label || '')}"><b>Custom:</b> ${esc(r.custom_label || 'every bird')}</span>` : esc(r.deck_title);
    return `<tr><td>${timeIST(r.ts_start)}<span class="ago">${ago(r.ts_start)}</span></td><td>${deckCell}</td><td>${LV[r.level] || ''}${r.shadow ? ' · shadow' : ''}</td><td class="num">${nf(r.score)}</td><td class="num">${r.answered ? r.correct + '/' + r.answered : '–'}</td><td>${result}</td><td>${esc(srcName(r.src).replace(/ \(typed.*\)/, ''))}</td><td>${esc(CN(r.country))}</td><td>${esc(r.device)}</td></tr>`;
  }).join('');

  $('#body').innerHTML = `
    <section class="hero">
      <div class="kpi big"><div class="l">Games played, all time</div><div class="v">${nf(totalGames)}</div><div class="s">${earlierG ? `Includes about ${nf(earlierG)} games from before tracking began (estimate)` : 'Counted permanently'}${a.first_day ? ` · tracked since ${a.first_day}` : ''}</div></div>
      <div class="kpi"><div class="l">Players</div><div class="v">${nf(players)}</div><div class="s">${earlierP ? `Includes about ${nf(earlierP)} from before tracking` : 'Unique devices'}</div></div>
      <div class="kpi"><div class="l">Finished games</div><div class="v">${pc(tracked ? fin / tracked : 0)}</div><div class="s">${nf(fin)} played to the end</div></div>
      <div class="kpi"><div class="l">Results shared</div><div class="v">${nf(shares)}</div><div class="s">${nf(sk('whatsapp'))} WhatsApp · ${nf(sk('card'))} score card · ${nf(sk('copy'))} copied</div></div>
    </section>
    <section class="periods">
      <div class="kpi"><div class="l">Today</div><div class="v">${nf(p.d1)}</div><div class="s">games</div></div>
      <div class="kpi"><div class="l">Last 7 days</div><div class="v">${nf(d7)}</div><div class="s">${trend == null ? 'games' : `<span class="${trend >= 0 ? 'up' : 'dn'}">${trend >= 0 ? '▲' : '▼'} ${Math.abs(Math.round(trend * 100))}%</span> vs the week before`}</div></div>
      <div class="kpi"><div class="l">Last 30 days</div><div class="v">${nf(p.d30)}</div><div class="s">games</div></div>
    </section>
    <section class="insights"><h2>What stands out</h2><ul>${ins.map(i => `<li>${i}</li>`).join('')}</ul></section>

    <h2 class="sec-t">Latest games</h2><p class="sec-s">The last 15 games played, newest first (IST)</p>
    <section class="card"><div class="tw"><table style="min-width:760px"><thead><tr><th>When</th><th>Deck</th><th>Level</th><th class="num">Score</th><th class="num">Correct</th><th>Result</th><th>Came from</th><th>Country</th><th>Device</th></tr></thead><tbody>${recentRows || '<tr><td colspan="9" class="empty">No games yet.</td></tr>'}</tbody></table></div></section>

    <h2 class="sec-t">Is it growing?</h2><p class="sec-s">Games and new players, last 30 days</p>
    <section class="grid">
      <div class="card"><h3>Games per day</h3><div class="sub">Dark = played to the end</div><div class="cols">${gcols}</div><div class="axis">${axis}</div></div>
      <div class="card"><h3>New players per day</h3><div class="sub">First time we have seen the player</div><div class="cols">${ncols}</div><div class="axis">${axis}</div></div>
    </section>

    <h2 class="sec-t">Do people stick around?</h2><p class="sec-s">Return visits and where games end</p>
    <section class="grid">
      <div class="card"><h3>Came back on another day</h3><div class="sub">Players with games on 2 or more different days</div><div class="big-n">${pc(comeBack)}</div><div class="sub" style="margin-top:4px">${nf(d.multiDay)} of ${nf(t.players)} tracked players</div></div>
      <div class="card"><h3>Games per player</h3><div class="sub">How many games each player has played</div>${barList(ppRows, { cls: 'b' })}</div>
      <div class="card"><h3>How games end</h3><div class="sub">Of all tracked games</div>${endHtml}</div>
    </section>

    <h2 class="sec-t">What do they play?</h2><p class="sec-s">Decks, difficulty and features</p>
    <section class="card"><h3>Decks</h3><div class="sub">"Last 7 days" shows whether the home page changes are spreading play around. Finished = games played to the end.</div>
      <div class="tw"><table><thead><tr><th>Deck</th><th class="num">Games</th><th class="num">All time</th><th class="num">Last 7 days</th><th class="num">Finished</th><th class="num">Accuracy</th></tr></thead><tbody>${deckRows}</tbody></table></div></section>
    <section class="grid" style="margin-top:16px">
      <div class="card"><h3>Difficulty</h3><div class="sub">Share of games, how many finish, and accuracy</div>
        <div class="tw"><table style="min-width:0"><thead><tr><th>Level</th><th class="num">Games</th><th class="num">Finished</th><th class="num">Accuracy</th></tr></thead><tbody>${levels.map(l => `<tr><td>${LV[l.level]}</td><td class="num">${pc(l.n / tracked)}</td><td class="num">${pc(l.f / l.n)}</td><td class="num">${pc(l.acc)}</td></tr>`).join('')}</tbody></table></div></div>
      <div class="card"><h3>Features used</h3><div class="sub">Share of all games</div><div class="rows">${feat.map(([l, n]) => `<div class="row"><span>${l}</span><b>${pc(n / Math.max(tracked, 1))}</b></div>`).join('')}</div></div>
      <div class="card"><h3>What people build</h3><div class="sub">The most common custom decks (${pc((t.custom || 0) / Math.max(tracked, 1))} of games use one)</div>
        ${barList((d.customDecks || []).map(r => ({ label: r.label, n: r.n })), { cls: 'b' })}</div>
    </section>

    <h2 class="sec-t">Which birds need attention?</h2><p class="sec-s">From every answer players have given (a bird needs 5 answers to appear)</p>
    <section class="grid">
      <div class="card"><h3>Hardest birds</h3><div class="sub">Lowest share named correctly</div><div class="birds" id="hardest"></div></div>
      <div class="card"><h3>Easiest birds</h3><div class="sub">Highest share named correctly</div><div class="birds" id="easiest"></div></div>
    </section>

    <h2 class="sec-t">How do people find it?</h2><p class="sec-s">Where games started from, and sharing</p>
    <section class="grid">
      <div class="card"><h3>How players arrive</h3><div class="sub">Games by where the visit came from. Shared links are tagged, so WhatsApp is not hidden as "direct".</div>
        ${barList((d.sources || []).map(r => ({ label: srcName(r.s), n: r.n })), { cls: 'b', fmt: r => `<b>${nf(r.n)}</b> · ${pc(r.n / tracked)}` })}</div>
      <div class="card"><h3>Sharing</h3><div class="sub">${shares && fin ? `About 1 share per ${Math.max(1, Math.round(fin / shares))} finished games` : 'Result shares'}</div>
        ${barList((d.shares || []).map(r => ({ label: sharesNames[r.kind] || r.kind, n: r.n })))}</div>
    </section>

    <h2 class="sec-t">Who is playing?</h2><p class="sec-s">Country, device and time of day</p>
    <section class="grid">
      <div class="card"><h3>Countries</h3><div class="sub">Games by country</div>${barList((d.countries || []).map(r => ({ label: CN(r.country), n: r.n })), { fmt: r => `<b>${nf(r.n)}</b> · ${pc(r.n / tracked)}` })}</div>
      <div class="card"><h3>Device</h3><div class="sub">Phone or computer</div>${devHtml}
        <h3 style="margin-top:22px;font-size:17px">When people play</h3><div class="sub">Games by hour (IST)</div><div class="cols" style="height:100px">${hcols}</div><div class="axis">${haxis}</div></div>
    </section>`;

  // bird names + pictures arrive a moment later
  const names = await loadBirds();
  const birdRow = (r, cls) => { const b = names[r.bird] || { name: r.bird.replace(/_/g, ' '), url: '' }; return `<div class="bird"><div class="th">${b.url ? `<img loading="lazy" src="${b.url}" alt="">` : ''}</div><div class="bn">${esc(b.name)}<small>${nf(r.seen)} answers</small></div><div class="pc ${cls}">${pc(r.ok / r.seen)}</div></div>`; };
  const fill = (id, list, cls) => { $('#' + id).innerHTML = list.length ? list.map(r => birdRow(r, cls)).join('') : '<div class="empty">Needs a few more games.</div>'; };
  fill('hardest', d.hardest || [], 'lo'); fill('easiest', d.easiest || [], 'hi');
  const li = [...document.querySelectorAll('.insights li')].find(x => x.innerHTML.includes('_HARD_'));
  if (li) { if (d.hardest && d.hardest[0]) { const b = names[d.hardest[0].bird]; li.innerHTML = li.innerHTML.replace('_HARD_', esc(b ? b.name : d.hardest[0].bird)); } else li.remove(); }
}
})();
</script>
</body>
</html>
